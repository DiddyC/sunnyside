name: Sunnyside
options:
  bundleIdPrefix: com.sunnyside
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_PREVIEWS: YES
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # The live App Store record already supports iPad, and iPad support cannot be
    # dropped from an existing app, so keep both families. Content is capped at a
    # readable width on wide screens.
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 898NP95GBU

targets:
  Sunnyside:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sunnyside
    # NOTE: Info.plist is GENERATED from the properties below on every
    # `xcodegen generate`. Edit project.yml, not Info.plist.
    info:
      path: Sunnyside/Info.plist
      properties:
        CFBundleDisplayName: Sunny-Side
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iPad multitasking requires all four orientations.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "Sunnyside uses your location once to fill in where you're starting from. It never leaves your phone."
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        # Must match the live App Store record ("Sunny-Side", Apple ID 6749254551)
        PRODUCT_BUNDLE_IDENTIFIER: com.didisd.SunnySideApp
        INFOPLIST_FILE: Sunnyside/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"

  SunnysideTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SunnysideTests
    dependencies:
      - target: Sunnyside
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.didisd.SunnySideAppTests
